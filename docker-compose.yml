## ReportPortal.io AI-powered Test Automation Dashboard
## Docker Compose deployment configuration
##

## @section Deployment Profiles
##
## The following profiles can be used to control which services are launched:
## - core: Essential services required for a standard ReportPortal deployment
## - infra: Infrastructure dependencies (database, message broker, gateway)
## - "": Default profile for optional services (analyzers, etc.)
##

## @section Logging configuration
##
## @param x-logging Shared logging configuration for all services
## Uses json-file logging driver with automatic log rotation
##
x-logging: &logging
  driver: "json-file"
  options:
    max-size: 100m
    max-file: "5"

## @section Database configuration
##
## @param x-database Shared database connection settings used across services
## @param db_host Internal hostname of the database container
## @param db_port Port used to connect to the database (default: 5432)
## @param db_user Username for service-level access to the database
## @param db_password Password for the specified database user
## @param db_name Logical database name used by services
##
x-database:
  db_host: &db_host postgres
  db_port: &db_port 5432
  db_user: &db_user ${POSTGRES_USER-rpuser}
  db_password: &db_password ${POSTGRES_PASSWORD-rppass}
  db_name: &db_name ${POSTGRES_DB-reportportal}

## @section AMQP (RabbitMQ) configuration
##
## @param x-amqp Shared message broker settings for internal service communication
## @param rabbitmq_host Hostname of the RabbitMQ container (Docker internal DNS)
## @param rabbitmq_port Port for AMQP protocol communication (default: 5672)
## @param rabbitmq_apiport Port to access RabbitMQ management UI (default: 15672)
## @param rabbitmq_user Username for authenticating RabbitMQ clients
## @param rabbitmq_password Password for the RabbitMQ user
##
x-amqp:
  rabbitmq_host: &rabbitmq_host rabbitmq
  rabbitmq_port: &rabbitmq_port 5672
  rabbitmq_apiport: &rabbitmq_apiport 15672
  rabbitmq_user: &rabbitmq_user ${RABBITMQ_DEFAULT_USER-rabbitmq}
  rabbitmq_password: &rabbitmq_password ${RABBITMQ_DEFAULT_PASS-rabbitmq}

## @section Storage configuration (OpenDAL)
##
## @param x-storage Shared storage configuration for all services (API, Jobs, Analyzer)
## ReportPortal 6.0+ uses Apache OpenDAL for object storage with S3 backend support
##
## Storage types:
## - filesystem (default): Local volume storage
## - s3-compatible: MinIO, SeaweedFS, Ceph RGW, and other S3-compatible services
## - aws-s3: Native Amazon S3 with IAM role support
##
x-storage: &storage-environment
  DATASTORE_TYPE: filesystem
  ## @param DATASTORE_PATH Path for filesystem storage (default mode)
  ##
  DATASTORE_PATH: /data/storage
  ##
  ## For S3-compatible storage (MinIO, SeaweedFS, Ceph RGW, etc.):
  ##
  # DATASTORE_TYPE: s3-compatible
  # DATASTORE_ENDPOINT: "http://minio:9000"
  # DATASTORE_REGION: ""
  # DATASTORE_ACCESSKEY: ${STORAGE_ACCESSKEY-rpuser}
  # DATASTORE_SECRETKEY: ${STORAGE_SECRETKEY-rppassword}
  # DATASTORE_DEFAULTBUCKETNAME: rp-bucket
  # RP_FEATURE_FLAGS: singleBucket
  # DATASTORE_BUCKETPREFIX: prj-
  # DATASTORE_BUCKETPOSTFIX: ""
  # RP_INTEGRATION_SALT_PATH: keystore
  ##
  ## For Amazon S3:
  ##
  # DATASTORE_TYPE: aws-s3
  # DATASTORE_REGION: us-east-1
  # DATASTORE_ACCESSKEY: ""
  # DATASTORE_SECRETKEY: ""
  # DATASTORE_DEFAULTBUCKETNAME: my-rp-bucket
  # RP_FEATURE_FLAGS: singleBucket

## @section Common environment variables
##
## @param x-environment Environment values for database, AMQP, and storage connectivity
##
x-environment: &common-environment
  RP_DB_HOST: *db_host
  RP_DB_PORT: *db_port
  RP_DB_USER: *db_user
  RP_DB_PASS: *db_password
  RP_DB_NAME: *db_name
  RP_AMQP_HOST: *rabbitmq_host
  RP_AMQP_PORT: *rabbitmq_port
  RP_AMQP_APIPORT: *rabbitmq_apiport
  RP_AMQP_USER: *rabbitmq_user
  RP_AMQP_PASS: *rabbitmq_password
  RP_AMQP_APIUSER: *rabbitmq_user
  RP_AMQP_APIPASS: *rabbitmq_password
  RP_AMQP_ANALYZER-VHOST: analyzer
  <<: *storage-environment

## @section Analyzer service environment
##
## @param x-analyzer-environment Environment variables for analyzer services (auto-analyzer)
##
x-analyzer-environment: &common-analyzer-environment
  LOGGING_LEVEL: info
  AMQP_EXCHANGE_NAME: analyzer-default
  AMQP_VIRTUAL_HOST: analyzer
  AMQP_URL: amqp://${RABBITMQ_DEFAULT_USER-rabbitmq}:${RABBITMQ_DEFAULT_PASS-rabbitmq}@rabbitmq:5672
  ES_HOSTS: http://opensearch:9200
  ANALYZER_BINARYSTORE_TYPE: filesystem
  <<: *storage-environment
  ## For filesystem storage, analyzer uses a dedicated subdirectory
  FILESYSTEM_DEFAULT_PATH: &analyzer-default-path /data/storage/analyzer
  ## For S3 storage, analyzer stores models under a dedicated path:
  ## <DATASTORE_DEFAULTBUCKETNAME>/<analyzerSubpath>/<DATASTORE_BUCKETPREFIX><projectId>/
  ## Example: rp-bucket/analyzer/prj-1/
  ## Uncomment and adjust DATASTORE_BUCKETPREFIX for S3:
  # DATASTORE_BUCKETPREFIX: analyzer/prj-
  # DATASTORE_BUCKETPOSTFIX: ""

## @section Analyzer storage mount
##
## Shared mount definition for the Analyzer and its one-shot permissions initializer
##
## By default, `analyzer-storage` is a managed Docker named volume.
## Analyzer receives it at `FILESYSTEM_DEFAULT_PATH` (`/data/storage/analyzer`),
## while the init service mounts the same volume at `/data` to set its root owner
## to the rootless Analyzer UID/GID.
##
## `nocopy: true` prevents Docker from copying files from the image filesystem
## into a newly created volume. Ownership is initialized explicitly by
## `analyzer-storage-init`.
##
x-analyzer-storage-volume: &analyzer-storage-volume
  type: volume
  source: analyzer-storage
  target: *analyzer-default-path
  volume:
    nocopy: true

## Local host-path alternative:
## To use it, comment out the named-volume block above and uncomment this
## complete block. The init service assigns UID:GID 65532:65532 only to this
## directory; do not point it to the shared ReportPortal storage path.
##
# x-analyzer-storage-volume: &analyzer-storage-volume
#   type: bind
#   source: ${ANALYZER_STORAGE_PATH:-./data/analyzer-storage}
#   target: *analyzer-default-path
#   bind:
#     create_host_path: true

services:
  ## @section ReportPortal services
  ##

  ## @param gateway Reverse proxy and entry point for ReportPortal
  ## - Port 8080: ReportPortal UI
  ## - Port 8081: Traefik dashboard
  ## - Port 443: HTTPS
  ## Uses Docker labels to auto-discover services
  ##
  gateway:
    image: traefik:v3.7.19
    logging:
      <<: *logging
    ports:
      - "8080:8080"  ## ReportPortal UI 
      - "8081:8081"  ## Traefik dashboard
      - "443:443"    ## HTTPS
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      ## SSL cert configs
      # - ./certs:/certs:ro  ## Mount directory containing SSL certificates
      # - ./acme.json:/acme.json  ## Let's Encrypt ACME challenge file
    command:
      - --providers.docker=true
      - --providers.docker.exposedByDefault=false
      - --providers.docker.constraints=Label(`traefik.expose`, `true`)
      - --log.level=INFO
      - --entrypoints.web.address=:8080
      - --entrypoints.traefik.address=:8081
      - --entrypoints.websecure.address=:443
      ## SSL cert configs
      - --entrypoints.websecure.http.tls=true
      # - --certificatesresolvers.letsencrypt.acme.email=your-email@example.com
      # - --certificatesresolvers.letsencrypt.acme.storage=/acme.json
      # - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      # - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
      # - --certificatesresolvers.filecerts.acme.certificatespath=/certs
      - --api.dashboard=true
      - --api.insecure=true
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/api/http/routers || wget -q --spider http://localhost:8081/api/http/routers || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - reportportal
    restart: always
    profiles:
      - core
      - infra
      - ''

  ## @param postgres PostgreSQL database service
  ## Stores metadata, user data, and test results
  ## Uses persistent volume for data storage
  ##
  postgres:
    image: postgres:18.6
    container_name: *db_host
    logging:
      <<: *logging
    shm_size: '512m'
    environment:
      POSTGRES_USER: *db_user
      POSTGRES_PASSWORD: *db_password
      POSTGRES_DB: *db_name
    volumes:
      - postgres:/var/lib/postgresql
    ## Uncomment to expose PostgreSQL externally
    # ports:
    #   - "5432:5432" 
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $$POSTGRES_DB -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 120s
      retries: 10
    networks:
      - reportportal
    restart: always
    profiles:
      - core
      - infra
      - ''

  ## @param rabbitmq RabbitMQ message broker for inter-service communication
  ## Provides queues for analysis and background jobs
  ## Includes management plugin for web UI
  ##
  rabbitmq:
    image: rabbitmq:4.4.0-management
    logging:
      <<: *logging
    # ports:
    ## Uncomment to expose AMQP protocol port
    #   - "5672:5672"
    ## Uncomment to expose RabbitMQ dashboard
    #   - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: *rabbitmq_user
      RABBITMQ_DEFAULT_PASS: *rabbitmq_password
    configs:
      - source: rabbitmq_enabled_plugins
        target: /etc/rabbitmq/enabled_plugins
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 60s
    networks:
      - reportportal
    restart: always
    profiles:
      - core
      - infra
      - ''

  ## @param opensearch OpenSearch engine for analyzer stack
  ## Stores and queries test log analysis data and ML models
  ## Runs in single-node mode with security disabled
  ##
  opensearch:
    image: opensearchproject/opensearch:3.9.0
    logging:
      <<: *logging
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      ## @env _JAVA_OPTIONS required to run OpenSearch on Apple Silicon 
      # _JAVA_OPTIONS: "-XX:UseSVE=0"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    # ports:
    ## OpenSearch HTTP API
    #   - "9200:9200"  # OpenSearch HTTP API
    ## OpenSearch Performance Analyzer
    #   - "9600:9600"  # OpenSearch Performance Analyzer
    volumes:
      - opensearch:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - reportportal
    restart: always
    profiles:
      - ''

  ## @section ReportPortal Core Services
  ##

  ## @param migrations Database schema migrations
  ## Applies DB schema migrations before services start
  ## Runs once on container start and exits
  ##
  migrations:
    image: ${MIGRATIONS_IMAGE-reportportal/migrations:6.0.0}
    build: ./migrations
    logging:
      <<: *logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_SERVER: *db_host
      POSTGRES_PORT: *db_port
      POSTGRES_DB: *db_name
      POSTGRES_USER: *db_user
      POSTGRES_PASSWORD: *db_password
      ## Configure SSL connection to the database
      ## Incoming parameters: require, disable
      # POSTGRES_SSLMODE: disable
    networks:
      - reportportal
    restart: on-failure
    profiles:
      - core
      - infra
      - ''

  ## @param ui ReportPortal web frontend
  ## Provides the visual interface for test reports
  ## Routed via Traefik under path `/ui` and root path `/`
  ##
  ui:
    image: ${UI_IMAGE-reportportal/service-ui:6.0.0}
    build: ./service-ui
    environment:
      RP_SERVER_PORT: "8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || wget -q --spider http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.middlewares.ui-strip-prefix.stripprefix.prefixes=/ui"
      - "traefik.http.routers.ui.middlewares=ui-strip-prefix@docker"
      - "traefik.http.routers.ui.rule=PathPrefix(`/ui`)"
      - "traefik.http.routers.ui.service=ui"
      - "traefik.http.routers.ui.entrypoints=web"
      - "traefik.http.routers.ui-secure.middlewares=ui-strip-prefix@docker"
      - "traefik.http.routers.ui-secure.rule=PathPrefix(`/ui`)"
      - "traefik.http.routers.ui-secure.service=ui"
      - "traefik.http.routers.ui-secure.entrypoints=websecure"
      # - "traefik.http.routers.ui-secure.tls=true"
      # - "traefik.http.routers.ui-secure.tls.certresolver=letsencrypt"
      - "traefik.http.services.ui.loadbalancer.server.port=8080"
      - "traefik.http.services.ui.loadbalancer.server.scheme=http"
      - "traefik.http.routers.root.rule=PathPrefix(`/`)"
      - "traefik.http.routers.root.priority=1"
      - "traefik.http.routers.root.service=ui"
      - "traefik.http.routers.root.entrypoints=web"
      - "traefik.http.routers.root-secure.rule=PathPrefix(`/`)"
      - "traefik.http.routers.root-secure.priority=1"
      - "traefik.http.routers.root-secure.service=ui"
      - "traefik.http.routers.root-secure.entrypoints=websecure"
      - "traefik.expose=true"
    networks:
      - reportportal
    restart: always
    profiles:
      - core
      - ''

  ## @param api ReportPortal backend API service
  ## Hosts core business logic and background processing
  ## Exposes REST API and internal job coordination endpoints
  ## Routed via Traefik under path `/api`
  ##
  api:
    image: ${API_IMAGE-reportportal/service-api:6.0.0}
    build: ./service-api
    logging:
      <<: *logging
    depends_on:
      rabbitmq:
        condition: service_healthy
      gateway:
        condition: service_started
      postgres:
        condition: service_healthy
      jobs:
        condition: service_healthy
    environment:
      <<: *common-environment
      LOGGING_LEVEL_ORG_HIBERNATE_SQL: info
      RP_REQUESTLOGGING: "false"
      AUDIT_LOGGER: "OFF"
      MANAGEMENT_HEALTH_ELASTICSEARCH_ENABLED: "false"
      RP_ENVIRONMENT_VARIABLE_ALLOW_DELETE_ACCOUNT: "false"
      JAVA_OPTS: >
        -Xmx1g 
        -XX:+HeapDumpOnOutOfMemoryError 
        -XX:HeapDumpPath=/tmp  
        -Dcom.sun.management.jmxremote.rmi.port=12349 
        -Dcom.sun.management.jmxremote 
        -Dcom.sun.management.jmxremote.local.only=false  
        -Dcom.sun.management.jmxremote.port=9010 
        -Dcom.sun.management.jmxremote.authenticate=false 
        -Dcom.sun.management.jmxremote.ssl=false 
        -Djava.rmi.server.hostname=0.0.0.0
      RP_JOBS_BASEURL: http://jobs:8686
      COM_TA_REPORTPORTAL_JOB_INTERRUPT_BROKEN_LAUNCHES_CRON: PT1H
      RP_ENVIRONMENT_VARIABLE_PATTERN-ANALYSIS_BATCH-SIZE: 100
      RP_ENVIRONMENT_VARIABLE_PATTERN-ANALYSIS_PREFETCH-COUNT: 1
      RP_ENVIRONMENT_VARIABLE_PATTERN-ANALYSIS_CONSUMERS-COUNT: 1
      COM_TA_REPORTPORTAL_JOB_LOAD_PLUGINS_CRON: PT10S
      COM_TA_REPORTPORTAL_JOB_CLEAN_OUTDATED_PLUGINS_CRON: PT10S
      REPORTING_QUEUES_COUNT: 10
      REPORTING_CONSUMER_PREFETCHCOUNT: 10
      REPORTING_PARKINGLOT_TTL_DAYS: 7
      RP_SESSION_LIVE: 86400      ## Session duration in seconds (1 day)
      RP_SAML_SESSION-LIVE: 4320  ## SAML session duration in minutes (3 days)
      RP_INITIAL_ADMIN_PASSWORD: ${RP_INITIAL_ADMIN_PASSWORD:-erebus}
    volumes:
      - storage:/data/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8585/health || wget -q --spider http://localhost:8585/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "traefik.enable=true"
      - "traefik.http.middlewares.api-strip-prefix.stripprefix.prefixes=/api"
      - "traefik.http.routers.api.middlewares=api-strip-prefix@docker"
      - "traefik.http.routers.api.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.api.service=api"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.routers.api-secure.middlewares=api-strip-prefix@docker"
      - "traefik.http.routers.api-secure.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.api-secure.service=api"
      - "traefik.http.routers.api-secure.entrypoints=websecure"
      # - "traefik.http.routers.api-secure.tls=true"
      # - "traefik.http.routers.api-secure.tls.certresolver=letsencrypt"
      - "traefik.http.services.api.loadbalancer.server.port=8585"
      - "traefik.http.services.api.loadbalancer.server.scheme=http"
      - "traefik.expose=true"
    networks:
      - reportportal
    restart: always
    profiles:
      - core
      - ''

  ## @param jobs Scheduled job processor for ReportPortal
  ## @param jobs Scheduled job processor for ReportPortal
  ## Executes cleanup, notification, and cron-based background tasks
  ## Uses AMQP and database to manage lifecycle of stored data and plugins
  ## Routed via Traefik under path `/jobs`
  ##
  ## @section Core jobs configuration
  ##
  ## Configuration for core jobs that clean the database and storage
  ##
  ## @param RP_ENVIRONMENT_VARIABLE_CLEAN_ATTACHMENT_CRON Cron expression for clean attachments job
  ## @param RP_ENVIRONMENT_VARIABLE_CLEAN_LOG_CRON Cron expression for clean logs job
  ## @param RP_ENVIRONMENT_VARIABLE_CLEAN_LAUNCH_CRON Cron expression for clean launches job
  ## @param RP_ENVIRONMENT_VARIABLE_BATCH-SIZE Number of launches processed in one batch
  ## @param RP_ENVIRONMENT_VARIABLE_CLEAN_STORAGE_CRON Cron expression for clean storage job (binary storage)
  ## @param RP_ENVIRONMENT_VARIABLE_STORAGE_PROJECT_CRON Cron expression for calculating average project attachments storage
  ## @param RP_ENVIRONMENT_VARIABLE_CLEAN_EXPIREDUSER_CRON Cron expression for clean expired user job
  ## @param RP_ENVIRONMENT_VARIABLE_CLEAN_EXPIREDUSER_RETENTIONPERIOD Number of days to keep expired users
  ## @param RP_ENVIRONMENT_VARIABLE_NOTIFICATION_EXPIREDUSER_CRON Cron expression for notification expired user job
  ## @param RP_ENVIRONMENT_VARIABLE_CLEAN_EVENTS_RETENTIONPERIOD Number of days to keep events
  ## @param RP_ENVIRONMENT_VARIABLE_CLEAN_EVENTS_CRON Cron expression for clean events job
  ## @param RP_ENVIRONMENT_VARIABLE_CLEAN_STORAGE_CHUNKSIZE Number of binaries removed from storage per job execution
  ##
  jobs:
    image: ${JOBS_IMAGE-reportportal/service-jobs:6.0.0}
    build: ./service-jobs
    logging:
      <<: *logging
    depends_on:
      rabbitmq:
        condition: service_healthy
      gateway:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      << : *common-environment
      RP_ENVIRONMENT_VARIABLE_CLEAN_ATTACHMENT_CRON: 0 0 */24 * * *
      RP_ENVIRONMENT_VARIABLE_CLEAN_LOG_CRON: 0 0 */24 * * *
      RP_ENVIRONMENT_VARIABLE_CLEAN_LAUNCH_CRON: 0 0 */24 * * *
      RP_ENVIRONMENT_VARIABLE_BATCH-SIZE: 10000
      RP_ENVIRONMENT_VARIABLE_CLEAN_STORAGE_CRON: 0 0 */24 * * *
      RP_ENVIRONMENT_VARIABLE_STORAGE_PROJECT_CRON: 0 */5 * * * *
      RP_ENVIRONMENT_VARIABLE_CLEAN_EXPIREDUSER_CRON: 0 0 */24 * * *
      RP_ENVIRONMENT_VARIABLE_CLEAN_EXPIREDUSER_RETENTIONPERIOD: 365
      RP_ENVIRONMENT_VARIABLE_NOTIFICATION_EXPIREDUSER_CRON: 0 0 */24 * * *
      RP_ENVIRONMENT_VARIABLE_CLEAN_EVENTS_RETENTIONPERIOD: 365
      RP_ENVIRONMENT_VARIABLE_CLEAN_EVENTS_CRON: 0 30 05 * * *
      RP_ENVIRONMENT_VARIABLE_CLEAN_STORAGE_CHUNKSIZE: 20000
      RP_PROCESSING_LOG_MAXBATCHSIZE: 2000
      RP_PROCESSING_LOG_MAXBATCHTIMEOUT: 6000
      RP_AMQP_MAXLOGCONSUMER: 1
      JAVA_OPTS: >
        -Djava.security.egd=file:/dev/./urandom
        -XX:+UseG1GC
        -XX:+UseStringDeduplication
        -XX:G1ReservePercent=20
        -XX:InitiatingHeapOccupancyPercent=60
        -XX:MaxRAMPercentage=70.0
        -XX:+HeapDumpOnOutOfMemoryError
        -XX:HeapDumpPath=/tmp
    volumes:
      - storage:/data/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8686/health || wget -q --spider http://localhost:8686/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - traefik.enable=true
      - traefik.http.middlewares.jobs-strip-prefix.stripprefix.prefixes=/jobs
      - traefik.http.routers.jobs.middlewares=jobs-strip-prefix@docker
      - traefik.http.routers.jobs.rule=PathPrefix(`/jobs`)
      - traefik.http.routers.jobs.service=jobs
      - traefik.http.routers.jobs.entrypoints=web
      - traefik.http.routers.jobs-secure.middlewares=jobs-strip-prefix@docker
      - traefik.http.routers.jobs-secure.rule=PathPrefix(`/jobs`)
      - traefik.http.routers.jobs-secure.service=jobs
      - traefik.http.routers.jobs-secure.entrypoints=websecure
      # - traefik.http.routers.jobs-secure.tls=true
      # - traefik.http.routers.jobs-secure.tls.certresolver=letsencrypt
      - traefik.http.services.jobs.loadbalancer.server.port=8686
      - traefik.http.services.jobs.loadbalancer.server.scheme=http
      - traefik.expose=true
    networks:
      - reportportal
    restart: always
    profiles:
      - core
      - ''

  ## @section Analyzer stack
  ##
  ## Analyzer services (optional): auto-analysis and ML training
  ##
  
  ## @param analyzer-storage-init One-shot rootless storage permissions initializer
  ## Runs before Analyzer and exits successfully after ownership verification
  ## Mounts only `analyzer-storage`, never the shared `storage` volume used by API and Jobs
  ## Uses a root process only to change the root directory owner once; it is not privileged,
  ## has no network, and receives only the `CHOWN` capability
  ## Maps the volume to `/data` so its root can be handled independently from
  ## the Analyzer application path `/data/storage/analyzer`
  ## On later deployments it verifies existing ownership and exits without
  ## recursively traversing Analyzer files
  ##
  analyzer-storage-init:
    image: busybox:1.38.0
    logging:
      <<: *logging
    user: "0:0"
    command:
      - sh
      - -ec
      - |
        current="$$(stat -c '%u:%g' /data)"
        expected="65532:65532"

        if [ "$$current" = "$$expected" ]; then
          echo "analyzer-storage-init: already ready ($$current)"
          exit 0
        fi

        echo "analyzer-storage-init: fixing owner $$current -> $$expected"
        chown "$$expected" /data
        echo "analyzer-storage-init: ready ($$(stat -c '%u:%g mode=%a' /data))"
    volumes:
      - <<: *analyzer-storage-volume
        target: /data
    network_mode: "none"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    restart: "no"
    profiles:
      - analyzer
      - ''

  ## @param analyzer Automatic test result analyzer
  ## Performs log analysis and pattern detection
  ## Relies on OpenSearch and RabbitMQ
  ## Writes persistent data to a dedicated analyzer volume
  ##
  analyzer:
    image: ${ANALYZER_IMAGE-reportportal/service-auto-analyzer:6.0.0}
    build: ./service-auto-analyzer
    logging:
      <<: *logging
    environment:
      <<: *common-analyzer-environment
    volumes:
      - <<: *analyzer-storage-volume
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      analyzer-storage-init:
        condition: service_completed_successfully
      opensearch:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - reportportal
    restart: always
    profiles:
      - analyzer
      - ''

## @section RabbitMQ configs
##
## Docker Compose configs mounted into the official rabbitmq image
##
## @param rabbitmq_enabled_plugins Plugin list for /etc/rabbitmq/enabled_plugins
## - rabbitmq_management: Management UI/API (included in *-management image)
## - rabbitmq_consistent_hash_exchange: Required by ReportPortal AMQP routing
## - rabbitmq_auth_backend_ldap: Optional LDAP auth backend
## - rabbitmq_shovel / rabbitmq_shovel_management: Shovel plugin required for ReportPortal
##
configs:
  rabbitmq_enabled_plugins:
    content: |
      [rabbitmq_management,rabbitmq_consistent_hash_exchange,rabbitmq_auth_backend_ldap,rabbitmq_shovel,rabbitmq_shovel_management].

## @section Volumes
##
## Named volumes for persistent data storage
##
## @param storage Shared volume for ReportPortal services
## This volume is mounted at /data/storage and shared between:
## - api: Stores attachments, plugins, and user uploads
## - jobs: Cleans up expired data from api
##
## All services must share the same volume for jobs to properly clean storage data.
## For custom host path, replace 'storage:' with a bind mount:
##   - ./data/storage:/data/storage
##
## @param analyzer-storage Dedicated volume for analyzer ML models and analysis data
## Mounted at /data/storage (FILESYSTEM_DEFAULT_PATH: /data/storage/analyzer)
## For custom host path, replace 'analyzer-storage:' with a bind mount:
##   - ./data/analyzer-storage:/data/storage
##
volumes:
  opensearch:
  storage:
  analyzer-storage:
  postgres:

## @section Networks
##
## Custom Docker network for ReportPortal service discovery
##
networks:
  reportportal:
